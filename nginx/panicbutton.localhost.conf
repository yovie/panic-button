# Panic Button — local vhost: http://panicbutton.localhost
#
# Enable (once):
#   sudo ln -sf "$PWD/nginx/panicbutton.localhost.conf" \
#     /etc/nginx/sites-enabled/panicbutton.localhost.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Proxies to the Docker Compose dev stack (`make deploy-dev`, port 18080).

server {
    listen 80;
    listen [::]:80;
    server_name panicbutton.localhost;

    server_tokens off;

    location /ws {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
