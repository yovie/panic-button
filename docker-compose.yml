name: panic-button

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: panic-button-server:latest
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      RUST_LOG: "${RUST_LOG:-info}"
      MQTT_ENABLED: "${MQTT_ENABLED:-true}"
      MQTT_URL: "${MQTT_URL:-mqtt://mosquitto:1883}"
      MQTT_TOPIC: "${MQTT_TOPIC:-#}"
      PANIC_KEYWORD: "${PANIC_KEYWORD:-PANIC,SOS}"
      DEVICES_FILE: "/app/data/devices.json"
    volumes:
      - device-data:/app/data
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 128M
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_TLS_PORT:-8883}:8883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      - ./mosquitto/passwd:/mosquitto/passwd:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          cpus: "0.10"
          memory: 64M
        limits:
          cpus: "0.50"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  simulator:
    build:
      context: .
      dockerfile: Dockerfile
    image: panic-button-server:latest
    entrypoint: ["/usr/local/bin/simulator"]
    command:
      [
        "--mode",
        "mqtt",
        "--mqtt",
        "mqtt://mosquitto:1883",
        "--server",
        "http://server:8080",
        "--devices",
        "3",
        "--auto-panic",
        "45",
      ]
    profiles: ["sim"]
    healthcheck:
      disable: true
    depends_on:
      server:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          cpus: "0.05"
          memory: 32M
        limits:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mosquitto-data:
  device-data:
